version: '3.8'

services:
  clipboard:
    build: .
    container_name: ${CLIPBOARD_CONTAINER_NAME:-clipboard}
    ports:
      - "${CLIPBOARD_HTTP_PORT:-8080}:80"   # Example default; override in .env
    environment:
      CLIPBOARD_CONVERTER_URL: ${CLIPBOARD_CONVERTER_URL:-}
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads  # Persist uploaded files
      - ./data:/app/data        # Persist database & state
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health | grep -q '\"status\":\"healthy\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - clipboard-network

networks:
  clipboard-network:
    driver: bridge
