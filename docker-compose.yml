version: '3.8'

services:
  clipboard:
    build: .
    container_name: relllab-clipboard
    ports:
      - "8084:80"   # Frontend (nginx)
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads  # Persist uploaded files
      - ./data:/app/data        # Persist database & state
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health | grep -q '\"status\":\"healthy\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - clipboard-network

networks:
  clipboard-network:
    driver: bridge
